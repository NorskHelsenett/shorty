  # lint, gosec,
  # run web
  # update (update dependencies)
  # check: swagger, test:backend, vet, lint:web, build:web
  # clean: rydder artfakter som bin/
  

  # task: audit, audit:fix, build:web, lint:web

#   test - Kjører backend-tester.
# test:web - Kjører frontend-tester (evt. placeholder hvis ingen tester finnes).
# build - Kjører full byggprosess for hele prosjektet.
# build:backend - Bygger backend-binær.
# build:web - Bygger frontend for produksjon.
# check - Full helsesjekk: format, lint, vet, test, build, swagger.
# audit - Kjører sikkerhetssjekk av avhengigheter.
# audit:fix - Prøver automatisk å rette kjente sårbarheter.
# run - Gir en samlet lokal kjøreflyt (eller instruks for å starte begge deler).
# run:backend - Starter backend lokalt.
# run:web - Starter frontend lokalt.
# docker:up - Starter nødvendige containere lokalt.
# docker:down - Stopper containere og rydder opp.
# clean - Fjerner byggeartefakter og midlertidige filer.
# ci - Kjører samme minimumssjekker som CI-pipeline før commit/push.